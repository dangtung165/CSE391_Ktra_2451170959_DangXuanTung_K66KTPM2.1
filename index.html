<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List UI - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">

    <div class="card main-card shadow-sm mb-5">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h4 mb-0 fw-bold">Task List</h2>
            <button class="btn btn-primary add-task-btn" id="openAddFormBtn">
                <i class="fas fa-plus me-1"></i> Add Task
            </button>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush task-list">
                
                <li class="list-group-item task-item d-flex align-items-center justify-content-between">
                    <div class="task-grid">
                        <div class="task-detail-col">
                            <span class="task-label">Task</span>
                            <p class="task-name">Go to gym</p>
                        </div>
                        <div class="task-detail-col priority-info ms-auto me-4 text-center">
                             <span class="task-label">Priority</span>
                             <p class="priority-text text-danger">High</p>
                        </div>
                        <div class="task-detail-col me-4">
                            <span class="badge rounded-pill status-badge">To Do</span>
                        </div>
                    </div>
                    <div class="task-actions flex-shrink-0 ms-4">
                        <div class="status-check-col">
                            <span class="custom-check check-empty"></span>
                        </div>
                        <a href="#" class="edit-icon"><i class="fas fa-edit"></i></a>
                        <a href="#" class="delete-icon"><i class="fas fa-trash"></i></a>
                    </div>
                </li>

                <li class="list-group-item task-item d-flex align-items-center justify-content-between">
                    <div class="task-grid">
                        <div class="task-detail-col">
                            <span class="task-label">Task</span>
                            <p class="task-name">Read a book</p>
                        </div>
                        <div class="task-detail-col priority-info ms-auto me-4 text-center">
                             <span class="task-label">Priority</span>
                             <p class="priority-text text-success">Low</p>
                        </div>
                        <div class="task-detail-col me-4">
                            <span class="badge rounded-pill status-badge">Done</span>
                        </div>
                    </div>
                    <div class="task-actions flex-shrink-0 ms-4">
                        <div class="status-check-col">
                            <span class="custom-check check-done"></span>
                        </div>
                        <a href="#" class="edit-icon"><i class="fas fa-edit"></i></a>
                        <a href="#" class="delete-icon"><i class="fas fa-trash"></i></a>
                    </div>
                </li>

                <li class="list-group-item task-item d-flex align-items-center justify-content-between">
                    <div class="task-grid">
                        <div class="task-detail-col">
                            <span class="task-label">Task</span>
                            <p class="task-name">Go to market</p>
                        </div>
                        <div class="task-detail-col priority-info ms-auto me-4 text-center">
                             <span class="task-label">Priority</span>
                             <p class="priority-text text-warning">Medium</p>
                        </div>
                        <div class="task-detail-col me-4">
                            <span class="badge rounded-pill status-badge">In Progress</span>
                        </div>
                    </div>
                    <div class="task-actions flex-shrink-0 ms-4">
                        <div class="status-check-col">
                            <span class="custom-check check-progress"></span>
                        </div>
                        <a href="#" class="edit-icon"><i class="fas fa-edit"></i></a>
                        <a href="#" class="delete-icon"><i class="fas fa-trash"></i></a>
                    </div>
                </li>

            </ul>
        </div>
    </div>

    <div class="card add-task-card shadow-sm col-md-10 mx-auto" id="addTaskForm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Add Task</h5>
            <button type="button" class="btn-close-custom" id="closeFormBtn" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="card-body">
            <form id="taskForm">
                <div class="mb-3">
                    <label for="taskInput" class="task-label d-block">Task</label>
                    <input type="text" class="form-control" id="taskInput" placeholder="Type your task here...">
                </div>
                <div class="mb-3">
                    <label class="task-label d-block">Priority</label>
                    <div class="d-flex priority-buttons">
                        <button type="button" class="btn btn-outline-danger btn-pill active">High</button>
                        <button type="button" class="btn btn-outline-warning btn-outline-warning-custom btn-pill">Medium</button>
                        <button type="button" class="btn btn-success btn-pill">Low</button>
                    </div>
                </div>
    
                <p id="errorMessage" style="color: red; display: none; font-size: 14px; margin-top: 5px;"></p>
            </form>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end">
            <button type="button" class="btn add-btn" id="submitTaskBtn">Add</button>
        </div>
    </div>

</div>
<script>
document.getElementById('saveTaskBtn').addEventListener('click', function() {
    const taskInput = document.getElementById('taskInput');
    const taskError = document.getElementById('taskError');
    const taskValue = taskInput.value.trim();

    // Reset error
    taskInput.classList.remove('is-invalid');
    taskError.classList.add('d-none');

    // Validation
    if (taskValue === "") {
        taskError.textContent = "Tên Task không được để trống!";
        taskError.classList.remove('d-none');
        taskInput.classList.add('is-invalid');
    } else if (taskValue.length > 100) {
        taskError.textContent = `Tên Task không được quá 100 kí tự (Hiện tại: ${taskValue.length} kí tự).`;
        taskError.classList.remove('d-none');
        taskInput.classList.add('is-invalid');
    } else {
        // Hợp lệ
        alert('Thêm Task hợp lệ: ' + taskValue);
        // Ở đây có thể xử lý đóng modal: 
        // bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
        taskInput.value = ""; // clear input
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
